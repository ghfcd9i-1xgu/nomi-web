function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve("");
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function downloadCSV(filename, rows) {
  const csv = "\uFEFF" + rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function copyText(text) {
  const value = String(text || "");
  try {
    if (navigator.clipboard?.writeText && window.isSecureContext) {
      await navigator.clipboard.writeText(value);
      return true;
    }
  } catch (e) {
    // 预览页/iframe/本地文件可能会禁用 Clipboard API，继续走降级方案
  }

  try {
    const ta = document.createElement("textarea");
    ta.value = value;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    ta.style.top = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return !!ok;
  } catch (e) {
    try {
      window.prompt("浏览器禁止自动复制，请手动复制：", value);
    } catch {}
    return false;
  }
}

function getVipTierByRecharge(totalRecharge = 0, levels = VIP_LEVELS) {
  const amount = num(totalRecharge);
  const sorted = [...(levels || VIP_LEVELS)].sort((a, b) => num(b.min) - num(a.min));
  return sorted.find((tier) => amount >= num(tier.min) && amount <= num(tier.max || 999999999)) || sorted[sorted.length - 1] || VIP_LEVELS[VIP_LEVELS.length - 1];
}
function recalculateCustomerStats(db) {
  const payments = db.payments || [];
  const orders = db.orders || [];
  const wallet = db.walletTransactions || [];
  const levels = db.vipLevels || VIP_LEVELS;

  const stats = {};
  (db.customers || []).forEach((c) => {
    stats[c.id] = { cumulativeRecharge: 0, cumulativeGift: 0, cumulativeSpend: 0, balance: 0 };
  });

  payments.forEach((p) => {
    if (!p.customerId || p.status !== "arrived") return;
    stats[p.customerId] = stats[p.customerId] || { cumulativeRecharge: 0, cumulativeGift: 0, cumulativeSpend: 0, balance: 0 };
    stats[p.customerId].cumulativeRecharge = r2(stats[p.customerId].cumulativeRecharge + num(p.amount));
    stats[p.customerId].cumulativeGift = r2(stats[p.customerId].cumulativeGift + num(p.giftAmount));
  });

  orders.forEach((o) => {
    if (!o.customerId || o.status !== "audit_passed") return;
    stats[o.customerId] = stats[o.customerId] || { cumulativeRecharge: 0, cumulativeGift: 0, cumulativeSpend: 0, balance: 0 };
    stats[o.customerId].cumulativeSpend = r2(stats[o.customerId].cumulativeSpend + num(o.amount));
  });

  wallet.forEach((w) => {
    if (!w.customerId) return;
    stats[w.customerId] = stats[w.customerId] || { cumulativeRecharge: 0, cumulativeGift: 0, cumulativeSpend: 0, balance: 0 };
    stats[w.customerId].balance = r2(stats[w.customerId].balance + num(w.amount));
  });

  return {
    ...db,
    customers: (db.customers || []).map((c) => {
      const s = stats[c.id] || { cumulativeRecharge: 0, cumulativeGift: 0, cumulativeSpend: 0, balance: num(c.balance) };
      const tier = getVipTierByRecharge(s.cumulativeRecharge, levels);
      return {
        ...c,
        cumulativeRecharge: r2(s.cumulativeRecharge),
        cumulativeGift: r2(s.cumulativeGift),
        cumulativeSpend: r2(s.cumulativeSpend),
        balance: r2(s.balance),
        level: tier.level,
        vipDiscountRate: tier.discountRate,
      };
    }),
  };
}

const r1 = (n) => Math.round((Number(n) || 0) * 10) / 10; // 伙伴云口径：金额保留一位小数
// 品类抽成：按接单模式前缀匹配（如“礼物”→70%），匹配不到用全局默认
function shareForGame(db, game) {
  const hit = (db.categoryShares || []).find((c) => c.enabled !== false && game && String(game).startsWith(c.match));
  return hit ? num(hit.pct) : (db.settings?.playerSharePct ?? 75);
}
// 结算公式（唯一来源，锁定）：
//   原价 = 单价 × 数量（数量可空，视为1）
//   总价 = 原价 − 折扣金额（默认值，可手动修正，修正不影响工资）
//   陪玩结算基数 = 原价 − 陪玩承担的折扣（折扣承担方式：店内承担 / 店内+陪玩共担）
//   陪玩工资 = 结算基数 × 品类抽成，保留一位小数
//   附加单价是文字说明（如“绝密1陪2+20/h”），加价由客服人工算入单价，不参与计算
function computeMoney({ qty, price, discount, sharePct = 75 }) {
  const q = (qty === "" || qty === null || qty === undefined || !num(qty)) ? 1 : num(qty);
  const subtotal = r2(q * num(price));
  const rate = discount ? (num(discount.rate) || 1) : 1;
  const bearPct = discount && discount.bearer === "shared" ? (num(discount.playerBearPct) || 0) : 0;
  const discountAmount = r2(Math.max(0, subtotal * (1 - rate)));
  const amount = r2(Math.max(0, subtotal - discountAmount));
  const playerBorne = r2(discountAmount * bearPct / 100);
  const settleBase = r2(Math.max(0, subtotal - playerBorne));
  const playerWage = r1(settleBase * sharePct / 100);
  return { subtotal, discountAmount, amount, playerBorne, settleBase, playerWage, profit: r2(amount - playerWage) };
}

// 提现税金公式（唯一来源，锁定）——还原自伙伴云「新税金计算」触发器：
//   本次月度应税 = MAX(0, 本月累计+本次 − 月免征额) − MAX(0, 本月累计 − 月免征额)
//   年内3%档剩余额度 = MAX(0, 年度额度 − 本年已累计应税)
//   应交税费 = 额度内×3% + 超出×10%，保留两位
function computeWithdrawalTax({ wageAmount, monthPriorWages, yearPriorTaxable, taxRule }) {
  const t = { monthlyExempt: 5000, band3Annual: 36000, rate3: 0.03, rate10: 0.10, ...(taxRule || {}) };
  const w = num(wageAmount), mp = num(monthPriorWages), yp = num(yearPriorTaxable);
  const taxableThis = r2(Math.max(0, mp + w - t.monthlyExempt) - Math.max(0, mp - t.monthlyExempt));
  const band3Left = Math.max(0, num(t.band3Annual) - yp);
  const at3 = Math.min(taxableThis, band3Left);
  const at10 = Math.max(0, r2(taxableThis - at3));
  const tax = r2(at3 * num(t.rate3) + at10 * num(t.rate10));
  return { taxableThis, at3: r2(at3), at10, tax };
}

      email: `${String(name).replace(/[^a-zA-Z0-9]/g, "player").slice(0, 8).toLowerCase()}${i + 1}@nexora.test`,
      status: playerStatus === "active" ? "可接单" : (playerStatus === "resigned" ? "休息" : "禁用"),
      realName: surnames[i % surnames.length] + givens[(i * 7) % givens.length],
      deposit: 0,

  });

  const games = [
    "三角洲护航-机密", "三角洲护航-绝密", "三角洲护航-航空", "三角洲护航-零号大坝",

  ];
  const billingKeys = ["hour", "round", "pack"];

  const staff = db.staffAccounts;

    { label: "无折扣", rate: 1 },

    { label: "9折", rate: 0.9 },
    { label: "85折", rate: 0.85 },
    { label: "8折", rate: 0.8 },
  ];

  // 充值记录
  db.customers.forEach((c, i) => {
    const count = i % 3 === 0 ? 3 : (i % 2 === 0 ? 2 : 1);
    for (let j = 0; j < count; j++) {
      const staffer = staff[(i + j) % staff.length];
      const baseRecharge = [500, 3200, 6800, 12000, 22000, 33000, 45000, 55000, 70000, 90000, 120000, 160000, 210000, 260000, 320000, 360000][i % 16];
      const amount = j === 0 ? baseRecharge : [48, 60, 70, 80, 112, 150, 180, 220, 300, 406][(i + j) % 10];
      const giftAmount = j === 1 && i % 4 === 0 ? 10 : 0;
      const status = j === 0 ? "arrived" : (j === 1 && i % 6 === 0 ? "pending" : "arrived");
      const createdAt = new Date(Date.now() - (i * 5 + j) * 3600 * 1000).toISOString();
      db.payments.push({
        id: `pay_${pad(i + 1, 3)}_${j}`,
        shop: c.shop,
        customerId: c.id,
        customerName: c.name,
        vipCode: c.vipCode,
        amount,
        giftAmount,
        status,
        method: payMethods[(i + j) % payMethods.length],
        images: [],
        operatorId: staffer.id,
        operatorName: staffer.name,
        note: j === 0 ? "测试充值记录" : "",
        createdAt,
      });
      if (status === "arrived") {
        db.walletTransactions.push({
          id: `wt_pay_${i}_${j}`,
          shop: c.shop,
          customerId: c.id,
          customerName: c.name,
          vipCode: c.vipCode,
          type: "recharge",
          amount: amount + giftAmount,
          title: "充值入账",
          refType: "payment",
          refId: `pay_${pad(i + 1, 3)}_${j}`,

          operatorName: staffer.name,

  // 订单记录：伙伴云结构——同一订单编号下可有多行（一行=一个陪玩的接单记录）
  const addonNotes = ["", "", "", "甜蜜/外服/faceit+10/h", "", "绝密1陪2+20/h", "", "钻石及以上1陪多2陪3+10/局", "", ""];
  const noCounters = {}; // 按 店铺+日期 递增
  let lastRow = null;
  for (let i = 0; i < 160; i++) {
    // 约1/4的行追加到上一行的订单编号下（多人单/多项目单）
    const appendToLast = lastRow && i % 4 === 1;
    const c = appendToLast ? db.customers.find(x => x.id === lastRow.customerId) : db.customers[i % db.customers.length];
    const p = db.players[(i * 3) % db.players.length];
    const staffer = appendToLast ? staff.find(s => s.id === lastRow.dispatcherId) || staff[0] : staff[i % staff.length];
    const d = appendToLast ? new Date(lastRow.createdAt) : (() => { const x = new Date(); x.setDate(x.getDate() - Math.floor(i / 9)); x.setHours(9 + (i % 14), (i * 7) % 60, 0, 0); return x; })();
    const qty = i % 5 === 0 ? null : [1, 1, 1.5, 2, 3][i % 5]; // 部分单不填数量（自定义/体验单）
    const price = [50, 55, 60, 70, 72, 80, 85, 100, 129, 258][i % 10];
    const disc = db.discounts[i % 3 === 0 ? 1 : 0]; // 部分首单8折
    const game = games[i % games.length];
    const sharePct = shareForGame(db, game);
    const m = computeMoney({ qty, price, discount: disc, sharePct });
    const status = orderStatuses[i % orderStatuses.length];
    const end = new Date(d.getTime() + Math.round((qty || 1) * 60) * 60000);
    let no;
    if (appendToLast) { no = lastRow.no; } else {
      const key = `${c.shop}_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
      noCounters[key] = (noCounters[key] || 0) + 1;
      no = `${c.shop === "NOMI" ? "N" : "E"}${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}${pad(noCounters[key], 3)}`;
    }
    const customerRecharge = db.payments.filter((pp) => pp.customerId === c.id && pp.status === "arrived").reduce((s, pp) => s + num(pp.amount), 0);
    const vipTier = getVipTierByRecharge(customerRecharge, db.vipLevels);
    const order = {
      id: `o_${pad(i + 1, 4)}`,
      no,
      shop: c.shop,
      customerId: c.id,
      customerName: c.name,
      customerVipCode: c.vipCode,
      playerId: p.id,
      playerName: p.name,
      playerGender: p.gender,
      dispatcherId: staffer.id,
      dispatcherName: staffer.name,
      game,
      tag: ["洲学妹", "女大一", "大一", "大二", "瓦学妹", "", ""][i % 7],
      billing: billingKeys[i % billingKeys.length],
      qty,
      price,
      addonNote: addonNotes[i % addonNotes.length],
      discountId: disc.id,
      discountLabel: disc.label,
      discountRate: disc.rate,
      bearer: disc.bearer,
      playerBearPct: disc.bearer === "shared" ? num(disc.playerBearPct) : 0,
      vipLevel: vipTier.level,
      vipDiscountRate: vipTier.discountRate,
      subtotal: m.subtotal,
      discountAmount: m.discountAmount,
      playerBorne: m.playerBorne,
      settleBase: m.settleBase,
      sharePct,
      amount: m.amount,
      playerWage: m.playerWage,
      profit: m.profit,
      status,
      settlementStatus: i % 5 === 0 ? "settled" : "unsettled",
      startAt: d.toISOString(),
      endAt: end.toISOString(),
      dispatchImage: "",
      resultImages: [],
      note: i % 10 === 0 ? "老板要求优先稳定上分" : "",
      source: ["KOOK私域", "老客复购", "客服转化", "朋友推荐"][i % 4],
      createdAt: d.toISOString(),
      updatedAt: nowISO(),
    };
    db.orders.push(order);
    lastRow = order;

    if (status === "audit_passed") {
      db.walletTransactions.push({
        id: `wt_order_${i}`,
        shop: c.shop,
        customerId: c.id,
        customerName: c.name,
        vipCode: c.vipCode,
        type: "order_deduct",
        amount: -m.amount,
        title: "订单扣款",
        refType: "order",
        refId: order.id,
        orderNo: no,
        operatorId: staffer.id,
        operatorName: staffer.name,
        createdAt: end.toISOString(),
      });
    }
  }

  // 测试数据对账：老板余额由余额流水汇总得出；如果测试订单导致负数，自动补一笔测试初始化充值
  const balanceByCustomer = {};
  db.customers.forEach(c => { balanceByCustomer[c.id] = 0; });
  db.walletTransactions.forEach(w => {
    if (!w.customerId) return;
    balanceByCustomer[w.customerId] = r2(num(balanceByCustomer[w.customerId]) + num(w.amount));
  });
  db.customers = db.customers.map((c, idx) => {
    let balance = r2(balanceByCustomer[c.id] || 0);
    if (balance < 0) {
      const topUp = r2(Math.abs(balance) + 100 + (idx % 5) * 20);
      const paymentId = `pay_init_${c.id}`;
      db.payments.unshift({
        id: paymentId,
        shop: c.shop,
        customerId: c.id,
        customerName: c.name,
        vipCode: c.vipCode,
        amount: topUp,
        giftAmount: 0,
        status: "arrived",
        method: "测试初始化",
        images: [],
        operatorId: "system",
        operatorName: "系统",
        note: "测试数据初始化补足余额",
        createdAt: new Date(Date.now() - (idx + 90) * 3600 * 1000).toISOString(),
      });
      db.walletTransactions.unshift({
        id: `wt_init_${c.id}`,
        shop: c.shop,
        customerId: c.id,
        customerName: c.name,
        vipCode: c.vipCode,
        type: "recharge",
        amount: topUp,
        title: "测试余额初始化",
        refType: "payment",
        refId: paymentId,
        operatorId: "system",
        operatorName: "系统",
        createdAt: new Date(Date.now() - (idx + 90) * 3600 * 1000).toISOString(),
      });
      balance = r2(balance + topUp);
    }
    return { ...c, balance };
  });

  // 工资结算表：从订单汇总出来，同时保留可操作数据
  db.settlements = db.orders.map((o, idx) => ({
    id: `set_${pad(idx + 1, 4)}`,
    shop: o.shop,
    orderId: o.id,
    orderNo: o.no,
    playerId: o.playerId,
    playerName: o.playerName,
    customerName: o.customerName,
    amount: o.amount,
    playerWage: o.playerWage,
    status: o.settlementStatus,
    createdAt: o.endAt,
    settledAt: o.settlementStatus === "settled" ? new Date(new Date(o.endAt).getTime() + 86400000).toISOString() : "",
    operatorName: o.settlementStatus === "settled" ? staff[idx % staff.length].name : "",
  }));

  db.auditLogs = [
    { id: "log_001", type: "system", title: "载入测试数据", detail: "已生成老板、陪玩、充值、订单、余额流水、工资结算数据", createdAt: nowISO() },
    { id: "log_002", type: "automation", title: "自动化规则已启用", detail: "充值到账/订单审核/工资结算自动化启用", createdAt: new Date(Date.now() - 600000).toISOString() },
  ];
  return recalculateCustomerStats(db);
}

function migrateDB(raw) {
  const base = seedData();
  const db = { ...base, ...(raw || {}) };
  db.customers = db.customers || [];
  db.players = db.players || [];

  db.players = db.players.map((p, i) => ({
    ...p,
    playerCode: p.playerCode || ("P" + pad(i + 1, 4)),
    wechatId: p.wechatId || p.wechat || ("W" + String(13125578500 + i * 9137).slice(0, 10)),
    phone: p.phone || ("1" + String(3100000000 + i * 73219463).slice(0, 10)),
    idCard: p.idCard || String(210681200212270000n + BigInt(i) * 137911131719n).slice(0, 18),
    verifyStatus: p.verifyStatus || "verified",
    rejectReason: p.rejectReason || "",
    playerStatus: p.playerStatus || (p.status === "休息" ? "resigned" : "active"),
    games: p.games || "无畏契约 / 三角洲行动",
    level: p.level || "新人",
    portalAccount: p.portalAccount || p.name,
    joinDate: p.joinDate || (p.createdAt ? String(p.createdAt).slice(0, 10) : ""),
    kookName: p.kookName || `${p.name || "player"}#${String(2400 + i * 131).slice(-4)}`,
    kookId: p.kookId || String(2127160589 + i * 36829137).slice(0, 10),
    email: p.email || `player${i + 1}@nexora.test`,
  }));
  db.orders = db.orders || [];
  db.payments = db.payments || [];
  db.walletTransactions = db.walletTransactions || [];
  db.settlements = db.settlements || [];
  db.staffAccounts = db.staffAccounts || base.staffAccounts;
  db.automations = db.automations || base.automations;
  db.customFields = db.customFields || base.customFields;
  db.savedViews = db.savedViews || base.savedViews;
  db.discounts = db.discounts || base.discounts;
  db.categoryShares = db.categoryShares || base.categoryShares;
  db.withdrawals = db.withdrawals || [];
  db.settings.taxRule = { ...base.settings.taxRule, ...(db.settings.taxRule || {}) };
  db.vipLevels = db.vipLevels || base.vipLevels || VIP_LEVELS;
  db.settings = { ...base.settings, ...(db.settings || {}) };
  db.auditLogs = db.auditLogs || [];
  return recalculateCustomerStats(db);
}

const hasStore = typeof window !== "undefined" && window.storage;
async function loadDB() {
  if (!hasStore) return seedData();
  try {
    const r = await window.storage.get(DB_KEY);
    if (r && r.value) return migrateDB(JSON.parse(r.value));
  } catch {}
  return seedData();
}
async function saveDB(db) {
  if (!hasStore) return;
  await window.storage.set(DB_KEY, JSON.stringify(db));
}

function PasteImageBox({ value, onChange, label = "图片", helper = "点击后 Ctrl+V 粘贴截图，也可选择文件" }) {
  const handleFile = async (file) => {
    if (!file) return;
    if (file.type && !file.type.startsWith("image/")) return;
    onChange(await fileToDataUrl(file));
  };
  const handlePaste = async (e) => {
    const items = Array.from(e.clipboardData?.items || []);
    const imageItem = items.find((item) => item.type && item.type.startsWith("image/"));
    if (!imageItem) return;
    e.preventDefault();
    await handleFile(imageItem.getAsFile());
  };
  return (
    <div
      tabIndex={0}
      onPaste={handlePaste}
      onDragOver={(e) => e.preventDefault()}
      onDrop={(e) => { e.preventDefault(); handleFile(e.dataTransfer?.files?.[0]); }}
      className="rounded-lg border border-dashed border-slate-300 bg-slate-50 hover:bg-white p-4 min-h-32 flex flex-col items-center justify-center text-center outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition"
    >
      {value ? (
        <div className="w-full">
          <img src={value} alt={label} className="max-h-44 mx-auto rounded-lg border border-slate-200 object-contain bg-white" />
          <div className="mt-3 flex items-center justify-center gap-2">
            <label className="text-xs px-2.5 py-1 rounded-md bg-slate-900 text-white cursor-pointer hover:bg-slate-800">
              重新选择
              <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFile(e.target.files?.[0])} />
            </label>
            <button type="button" onClick={() => onChange("")} className="text-xs px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200">清除</button>
            <span className="text-xs text-slate-400">也可 Ctrl+V 替换</span>
          </div>
        </div>
      ) : (
        <div>
          <div className="text-sm font-medium text-slate-700">{label}</div>
          <div className="text-xs text-slate-400 mt-1">{helper}</div>
          <div className="mt-3 flex items-center justify-center gap-2">
            <span className="text-xs bg-white border border-slate-200 rounded px-2 py-1">Ctrl</span>
            <span className="text-xs text-slate-300">+</span>
            <span className="text-xs bg-white border border-slate-200 rounded px-2 py-1">V</span>
            <label className="text-xs px-2.5 py-1 rounded-md bg-slate-900 text-white cursor-pointer hover:bg-slate-800 ml-2">
              选择文件
              <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFile(e.target.files?.[0])} />
            </label>
          </div>
        </div>
      )}
    </div>
  );
}

function ToolbarButton({ active, children, onClick }) {

/* ---------------------------- Generic DataTable v3 ---------------------------- */
function getGenericValue(row, col) {
  if (col.value) return col.value(row);
  return row[col.key];
}

function renderGenericCell(value, row, col) {
  if (col.render) return col.render(value, row);
  if (col.type === "money") return <span className="font-mono">{yuan(value)}</span>;
  if (col.type === "number") return <span className="font-mono">{value ?? "—"}</span>;
  if (col.type === "date") return <span className="whitespace-nowrap">{value || "—"}</span>;
  if (col.type === "datetime") return <span className="whitespace-nowrap">{fmtTime(value)}</span>;
  if (col.type === "shop") return <ShopBadge shop={value} />;
  if (col.type === "image") return <ImagePreview src={value} label={col.label} />;
  if (col.type === "badge") return <Badge tone={col.tone?.(value,row)||"slate"}>{value || "—"}</Badge>;
  return <span className={col.truncate ? "block max-w-[180px] truncate" : ""} title={String(value ?? "")}>{value ?? "—"}</span>;
}

function GenericDataTable({ title, config, db, persist, flash, setTab }) {
  const [q, setQ] = useState("");
  const [viewId, setViewId] = useState(config.defaultView || "all");
  const [sort, setSort] = useState(null);
  const [selected, setSelected] = useState({});
  const [hidden, setHidden] = useState(new Set(config.defaultHidden || []));
  const [showFields, setShowFields] = useState(false);

  const sourceRows = config.getRows(db);
  const view = (config.views || [{ id: "all", name: "全部数据", filter: () => true }]).find(v => v.id === viewId) || { filter: () => true };
  let rows = sourceRows.filter(r => view.filter ? view.filter(r, db) : true);
  const searchFields = config.searchFields || config.columns.map(c => c.key);
  rows = rows.filter(row => !q || searchFields.some(f => String(typeof f === "function" ? f(row) : row[f] ?? "").toLowerCase().includes(q.toLowerCase())));

  if (sort) {
    const col = config.columns.find(c => c.key === sort.key);
    rows = [...rows].sort((a,b) => {
      const av = getGenericValue(a, col);
      const bv = getGenericValue(b, col);
      if (av === bv) return 0;
      return (av > bv ? 1 : -1) * (sort.dir === "asc" ? 1 : -1);
    });
  }

  const visibleCols = config.columns.filter(c => !hidden.has(c.key));
  const selectedIds = Object.keys(selected).filter(k => selected[k]);
  const allChecked = rows.length > 0 && rows.every(r => selected[r.id]);

  const updateRow = (id, patch) => {
    if (!config.updateRow) return;
    config.updateRow({ id, patch, db, persist, flash });
  };

  const exportCSV = () => {
    const header = visibleCols.map(c => c.label);
    const body = rows.map(r => visibleCols.map(c => {
      const value = getGenericValue(r, c);
      if (c.exportValue) return c.exportValue(value, r);
      if (c.mapLabel) return c.mapLabel(value, r);
      if (c.type === "money") return num(value);
      if (c.type === "datetime") return fmtTime(value);
      return value ?? "";
    }));
    downloadCSV(`nexora_${title}_${new Date().toISOString().slice(0,10)}.csv`, [header, ...body]);
  };

  return (
    <Card>
      <div className="flex items-center gap-1 p-2 border-b border-slate-200">
        {(config.views || [{ id: "all", name: "全部数据" }]).map(v => (
          <button key={v.id} onClick={() => setViewId(v.id)} className={`px-3 py-1.5 rounded-lg text-sm transition ${viewId === v.id ? "bg-slate-900 text-white" : "text-slate-500 hover:text-slate-900 hover:bg-slate-100"}`}>
            {v.name}
          </button>
        ))}
        {config.createAction && (
          <button onClick={() => config.createAction({ setTab })} className="ml-auto inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-sm hover:bg-indigo-500">
            <FilePlus2 size={14}/>创建
          </button>
        )}
      </div>

      <div className="flex flex-wrap gap-1.5 items-center p-2.5 border-b border-slate-200">
        <button onClick={() => setShowFields(!showFields)} className="text-xs px-2 py-1 rounded bg-indigo-50 text-indigo-700">字段设置</button>
        <button className="text-xs px-2 py-1 rounded hover:bg-slate-100">分组</button>
        <button className="text-xs px-2 py-1 rounded hover:bg-slate-100">筛选</button>
        <button className="text-xs px-2 py-1 rounded hover:bg-slate-100">排序</button>
        <button className="text-xs px-2 py-1 rounded hover:bg-slate-100">冻结</button>
        {selectedIds.length > 0 && <Badge tone="indigo">已选 {selectedIds.length}</Badge>}
        <div className="ml-auto flex items-center gap-2">
          <div className="relative">
            <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
            <input className={inputCls + " pl-9 w-72"} placeholder="搜索数据、编号、昵称、客服..." value={q} onChange={(e) => setQ(e.target.value)} />
          </div>
          <button onClick={exportCSV} className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-slate-900 text-white text-sm hover:bg-slate-800 transition"><Download size={14} />导出</button>
        </div>
      </div>

      {showFields && (
        <div className="p-3 border-b border-slate-200 bg-slate-50 flex flex-wrap gap-2">
          {config.columns.map(c => (
            <label key={c.key} className="inline-flex items-center gap-1.5 text-xs bg-white border border-slate-200 rounded px-2 py-1">
              <input type="checkbox" checked={!hidden.has(c.key)} onChange={(e) => {
                const next = new Set(hidden);
                e.target.checked ? next.delete(c.key) : next.add(c.key);
                setHidden(next);
              }} />
              {c.label}
            </label>
          ))}
        </div>
      )}

      <div className="overflow-x-auto">
        <table className="w-full text-xs" style={{ minWidth: config.minWidth || 1200 }}>
          <thead className="bg-slate-50/80 text-slate-500">
            <tr>
              <th className="px-2 py-2 w-10 text-left"><input type="checkbox" checked={allChecked} onChange={(e) => {
                const next = {...selected};
                rows.forEach(r => next[r.id] = e.target.checked);
                setSelected(next);
              }}/></th>
              {visibleCols.map(c => (
                <th key={c.key} className={`px-2 py-2 font-medium ${c.align === "right" ? "text-right" : "text-left"}`}>
                  <button className="inline-flex items-center gap-1 hover:text-slate-900" onClick={() => setSort(sort?.key === c.key ? { key: c.key, dir: sort.dir === "asc" ? "desc" : "asc" } : { key: c.key, dir: "asc" })}>
                    {c.label}{sort?.key === c.key && <span>{sort.dir === "asc" ? "↑" : "↓"}</span>}
                  </button>
                </th>
              ))}
              {config.rowActions && <th className="px-2 py-2 text-left font-medium">操作</th>}
            </tr>
          </thead>
          <tbody>
            {rows.map(row => (
              <tr key={row.id} className="border-t border-slate-100 hover:bg-indigo-50/40">
                <td className="px-2 py-2"><input type="checkbox" checked={!!selected[row.id]} onChange={(e) => setSelected({...selected, [row.id]: e.target.checked})}/></td>
                {visibleCols.map(col => (
                  <td key={col.key} className={`px-2 py-2 ${col.align === "right" ? "text-right" : "text-left"} ${col.nowrap ? "whitespace-nowrap" : ""}`}>
                    {col.edit === "select" ? (
                      <select value={getGenericValue(row, col) || ""} onChange={(e) => updateRow(row.id, { [col.key]: e.target.value })} className="bg-transparent text-xs outline-none">
                        {(col.options || []).map(opt => typeof opt === "string" ? <option key={opt} value={opt}>{opt}</option> : <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                      </select>
                    ) : renderGenericCell(getGenericValue(row, col), row, col)}
                  </td>
                ))}
                {config.rowActions && <td className="px-2 py-2">{config.rowActions({ row, db, persist, flash, setTab })}</td>}
              </tr>
            ))}
            {rows.length === 0 && <tr><td colSpan={visibleCols.length + 2} className="text-center text-slate-400 py-12">暂无数据</td></tr>}
          </tbody>
        </table>
      </div>
      <div className="px-3 py-2 border-t border-slate-200 text-xs text-slate-500 flex justify-between">
        <span>{rows.length} 条</span>
        <span>DataTable v3.0：视图 / 字段显示隐藏 / 搜索 / 排序 / 导出 / 行内状态修改</span>
      </div>
    </Card>
  );
}

/* -------------------------------- dashboard ------------------------------- */
function Dashboard({ db }) {
  const validOrders = db.orders.filter(o => o.status !== "audit_rejected");
  const passedOrders = db.orders.filter(o => o.status === "audit_passed");
  const todayOrders = validOrders.filter(o => isToday(o.createdAt));
  const todayPay = db.payments.filter(p => isToday(p.createdAt) && p.status === "arrived");
  const rev = passedOrders.reduce((s,o)=>s+num(o.amount),0);
  const pay = db.payments.filter(p=>p.status==="arrived").reduce((s,p)=>s+num(p.amount)+num(p.giftAmount),0);
  const wage = passedOrders.reduce((s,o)=>s+num(o.playerWage),0);
  const balance = db.customers.reduce((s,c)=>s+num(c.balance),0);
  const tiles = [
    ["今日订单", todayOrders.length + " 笔"],
    ["今日充值", yuan(todayPay.reduce((s,p)=>s+num(p.amount),0))],
    ["累计订单额(已审核)", yuan(rev)],
    ["陪玩工资(已审核)", yuan(wage)],
    ["账户余额池", yuan(balance)],
    ["老板数量", db.customers.length + " 人"],
  ];
  return (
    <div>
      <PageIntro title="数据概览" subtitle="直营店、SaaS店和联盟店未来都可以使用同一套数据模型。" />
      <div className="grid grid-cols-2 lg:grid-cols-6 gap-4 mb-5">
        {tiles.map(([k,v]) => (
          <Card key={k} className="p-5 relative overflow-hidden">
            <div className="text-xs text-slate-500 mb-1">{k}</div>
            <div className="text-2xl font-bold font-mono tracking-tight">{v}</div>
          </Card>
        ))}
      </div>
      <div className="grid lg:grid-cols-2 gap-5">
        <Card className="p-4">
          <h3 className="font-medium mb-3">待处理事项</h3>
          <div className="space-y-2 text-sm">
            <div className="flex justify-between border-b border-slate-100 pb-2"><span>等待审核订单</span><Badge tone="amber">{db.orders.filter(o=>["waiting_review"].includes(o.status)).length}</Badge></div>
            <div className="flex justify-between border-b border-slate-100 pb-2"><span>待审核充值</span><Badge tone="amber">{db.payments.filter(p=>p.status==="pending").length}</Badge></div>
            <div className="flex justify-between border-b border-slate-100 pb-2"><span>未结算工资</span><Badge tone="amber">{db.settlements.filter(s=>s.status==="unsettled").length}</Badge></div>
            <div className="flex justify-between"><span>余额不足老板</span><Badge tone="rose">{db.customers.filter(c=>num(c.balance)<50).length}</Badge></div>
          </div>
        </Card>
        <Card className="p-4">
          <h3 className="font-medium mb-3">店铺拆分</h3>
          {Object.keys(SHOPS).map(shop => {
            const o = validOrders.filter(x=>x.shop===shop);
            const p = db.payments.filter(x=>x.shop===shop && x.status==="arrived");
            return (
              <div key={shop} className="flex items-center justify-between border-b border-slate-100 py-3">
                <div><ShopBadge shop={shop} /> <span className="text-sm text-slate-500 ml-2">{SHOPS[shop].name}</span></div>
                <div className="text-right text-sm"><div>订单 {yuan(o.reduce((s,x)=>s+num(x.amount),0))}</div><div className="text-slate-500">充值 {yuan(p.reduce((s,x)=>s+num(x.amount),0))}</div></div>
              </div>
            )
          })}
        </Card>
      </div>
    </div>
  );
}

function CustomerServiceWorkbench({ db, persist, flash, setTab }) {
  const [pane, setPane] = useState("recharge");
  const [shop, setShop] = useState("NOMI");
  const [mode, setMode] = useState("new");
  const [search, setSearch] = useState("");
  const [customerId, setCustomerId] = useState("");
  const [name, setName] = useState("");
  const [vipCode, setVipCode] = useState("");
  const [gender, setGender] = useState("男");
  const [wechatName, setWechatName] = useState("");
  const [kookName, setKookName] = useState("");
  const [kookId, setKookId] = useState("");
  const [referrer, setReferrer] = useState("");
  const [customerType, setCustomerType] = useState("normal");
  const [custNote, setCustNote] = useState("");
  const [method, setMethod] = useState("微信");
  const [payStatus, setPayStatus] = useState("arrived");
  const [amount, setAmount] = useState("");
  const [giftAmount, setGiftAmount] = useState("0");
  const [payImages, setPayImages] = useState([]);
  const [note, setNote] = useState("");
  const staff = db.staffAccounts.filter(s => s.enabled !== false);
  const [operatorId, setOperatorId] = useState(staff[0]?.id || "");

  const autoVip = nextVipCode(db.customers);
  const shopCustomers = db.customers.filter(c => c.shop === shop);
  const filteredCustomers = shopCustomers.filter(c => !search || [c.name,c.vipCode,c.kookName,c.kookId,c.wechatName].some(x=>String(x||"").toLowerCase().includes(search.toLowerCase())));
  const selectedCustomer = db.customers.find(c => c.id === customerId);

  useEffect(() => {
    if (mode === "new") {
      setCustomerId(""); setName(""); setVipCode(""); setGender("男"); setWechatName(""); setKookName(""); setKookId(""); setReferrer(""); setCustomerType("normal"); setCustNote("");
    } else if (selectedCustomer) {
      setName(selectedCustomer.name || ""); setVipCode(selectedCustomer.vipCode || ""); setGender(selectedCustomer.gender || "男");
      setWechatName(selectedCustomer.wechatName || ""); setKookName(selectedCustomer.kookName || ""); setKookId(selectedCustomer.kookId || ""); setReferrer(selectedCustomer.referrer || "");
      setCustomerType(selectedCustomer.customerType || "normal"); setCustNote(selectedCustomer.note || "");
    }
  }, [mode, customerId]);

  const saveRecharge = () => {
    if (mode === "old" && !selectedCustomer) return flash("请选择老客户");
    if (!name.trim()) return flash("请填写老板昵称");
    const finalVip = (vipCode.trim() || autoVip).toUpperCase();
    if (db.customers.some(c => c.vipCode === finalVip && c.id !== customerId)) return flash("VIP编号重复");
    const recharge = r2(num(amount));
    const gift = r2(num(giftAmount));
    if (recharge <= 0 && gift <= 0) return flash("请填写充值金额或赠送金额");
    const staffer = staff.find(s=>s.id===operatorId) || staff[0];
    let next = { ...db, customers:[...db.customers], payments:[...db.payments], walletTransactions:[...db.walletTransactions], auditLogs:[...db.auditLogs] };
    let cid = customerId;
    if (mode === "new") {
      cid = uid("c_");
      next.customers.unshift({ id: cid, shop, name: name.trim(), vipCode: finalVip, level:"VIP0", gender, wechatName:wechatName.trim(), kookName:kookName.trim(), kookId:kookId.trim(), referrer:referrer.trim(), enteredBy: staffer?.name || "", customerType, note: custNote.trim(), balance:0, createdAt:nowISO() });
    } else {
      next.customers = next.customers.map(c => c.id === cid ? { ...c, name:name.trim(), vipCode:finalVip, gender, wechatName:wechatName.trim(), kookName:kookName.trim(), kookId:kookId.trim(), referrer:referrer.trim(), customerType, note: custNote.trim() } : c);
    }
    const payment = { id: uid("pay_"), shop, customerId:cid, customerName:name.trim(), vipCode:finalVip, amount:recharge, giftAmount:gift, status:payStatus, method, images:payImages, operatorId:staffer?.id, operatorName:staffer?.name, note:note.trim(), createdAt:nowISO() };
    next.payments.unshift(payment);
    if (payStatus === "arrived") {
      const delta = r2(recharge + gift);
      next.customers = next.customers.map(c => c.id === cid ? { ...c, balance:r2(num(c.balance)+delta) } : c);
      next.walletTransactions.unshift({ id:uid("wt_"), shop, customerId:cid, customerName:name.trim(), vipCode:finalVip, type:"recharge", amount:delta, title:"充值入账", refType:"payment", refId:payment.id, operatorId:staffer?.id, operatorName:staffer?.name, createdAt:nowISO() });
    }
    next.auditLogs.unshift({ id:uid("log_"), type:"payment", title:"创建充值记录", detail:`${name} ${finalVip} ${yuan(recharge)} 赠送${yuan(gift)} ${PAY_STATUS[payStatus].label}`, createdAt:nowISO() });
    persist(next);
    flash(payStatus === "arrived" ? "充值已入账" : "充值已创建，等待审核");
    setMode("old"); setCustomerId(cid); setAmount(""); setGiftAmount("0"); setPayImages([]); setNote("");
  };

  return (
    <div className="space-y-5">
      <PageIntro title="快捷操作台" subtitle={<span>充值上传付款记录、结单后半小时内审核订单 <span className="text-rose-500">★ 上下班开关公众号客服接待 ★</span></span>} />
      <Card>
        <div className="flex items-center gap-2 border-b border-slate-200 px-4 pt-3">
          <ToolbarButton active={pane==="order"} onClick={()=>setPane("order")}>陪玩报单</ToolbarButton>
          <ToolbarButton active={pane==="recharge"} onClick={()=>setPane("recharge")}>开卡充值</ToolbarButton>
          <ToolbarButton active={pane==="balance"} onClick={()=>setPane("balance")}>余额查询</ToolbarButton>
          <ToolbarButton active={pane==="review"} onClick={()=>setPane("review")}>等待审核订单</ToolbarButton>
          <button onClick={()=>setTab("payments")} className="ml-auto text-sm text-indigo-600 hover:underline">进入充值详情表</button>
          <button onClick={()=>setTab("orders")} className="text-sm text-indigo-600 hover:underline">进入订单详情表</button>
        </div>

        {pane === "order" && <OrderCreatePane db={db} persist={persist} flash={flash} />}

        {pane === "recharge" && (
          <div className="p-5 space-y-4">
            <div className="flex items-center gap-2">
              <select className={inputCls + " w-auto"} value={shop} onChange={e=>setShop(e.target.value)}><option value="NOMI">NOMI</option><option value="EVE">EVE</option></select>
              <select className={inputCls + " w-auto"} value={operatorId} onChange={e=>setOperatorId(e.target.value)}>{staff.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
              <button onClick={()=>setMode("new")} className={`px-3 py-1.5 rounded-full text-xs border ${mode==="new"?"bg-sky-50 text-sky-700 border-sky-300":"border-slate-300 text-slate-500"}`}>新客户</button>
              <button onClick={()=>setMode("old")} className={`px-3 py-1.5 rounded-full text-xs border ${mode==="old"?"bg-slate-100 text-slate-800 border-slate-300":"border-slate-300 text-slate-500"}`}>老客户</button>
            </div>

            {mode === "old" && (
              <div className="grid md:grid-cols-2 gap-3">
                <Field label="搜索老客户"><input className={inputCls} value={search} onChange={e=>setSearch(e.target.value)} placeholder="老板昵称 / VIP编号 / KOOK / 微信" /></Field>
                <Field label="选择老客户"><select className={inputCls} value={customerId} onChange={e=>setCustomerId(e.target.value)}><option value="">请选择老客户…</option>{filteredCustomers.map(c=><option key={c.id} value={c.id}>{c.name} | {c.vipCode} | 余额 {yuan(c.balance)}</option>)}</select></Field>
              </div>
            )}

            <div className="text-center text-xs text-slate-500 border-y border-slate-100 py-2">{mode==="new" ? "新客户" : "老客户信息"}</div>
            <div className="grid md:grid-cols-4 gap-3">
              <Field label="老板昵称" required><input className={inputCls} value={name} onChange={e=>setName(e.target.value)} /></Field>
              <Field label="老板编号"><input className={inputCls + " font-mono"} placeholder={autoVip} value={vipCode} onChange={e=>setVipCode(e.target.value.toUpperCase())} /></Field>
              <Field label="性别"><select className={inputCls} value={gender} onChange={e=>setGender(e.target.value)}><option>男</option><option>女</option><option>未填写</option></select></Field>
              <Field label="微信名字"><input className={inputCls} value={wechatName} onChange={e=>setWechatName(e.target.value)} /></Field>
            </div>
            <div className="grid md:grid-cols-3 gap-3">
              <Field label="KOOK名"><input className={inputCls} value={kookName} onChange={e=>setKookName(e.target.value)} /></Field>
              <Field label="KOOK唯一ID"><input className={inputCls} value={kookId} onChange={e=>setKookId(e.target.value)} /></Field>
              <Field label="推荐人"><input className={inputCls} value={referrer} onChange={e=>setReferrer(e.target.value)} /></Field>
            </div>
            <div className="grid md:grid-cols-3 gap-3">
              <Field label="老板类型" hint="可透支老板余额不足也可审核通过">
                <select className={inputCls} value={customerType} onChange={e=>setCustomerType(e.target.value)}>
                  <option value="normal">不可透支消费</option>
                  <option value="overdraft">可透支消费</option>
                </select>
              </Field>
              <Field label="老板备注" hint="如 首单八折 等长期约定"><input className={inputCls} value={custNote} onChange={e=>setCustNote(e.target.value)} placeholder="如 首单八折" /></Field>
              <div />
            </div>
            <div className="grid md:grid-cols-4 gap-3">
              <Field label="充值方式" required><select className={inputCls} value={method} onChange={e=>setMethod(e.target.value)}>{PAY_METHODS.map(m=><option key={m}>{m}</option>)}</select></Field>
              <Field label="充值状态"><select className={inputCls} value={payStatus} onChange={e=>setPayStatus(e.target.value)}>{Object.entries(PAY_STATUS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select></Field>
              <Field label="充值金额" required><input type="number" className={inputCls+" font-mono"} value={amount} onChange={e=>setAmount(e.target.value)} /></Field>
              <Field label="赠送金额"><input type="number" className={inputCls+" font-mono"} value={giftAmount} onChange={e=>setGiftAmount(e.target.value)} /></Field>
            </div>
            <div className="grid md:grid-cols-2 gap-3">
              <Field label={`收款截图（最多3张，已传${payImages.length}张）`}>
                <div className="space-y-2">
                  {payImages.length > 0 && (
                    <div className="flex gap-2 flex-wrap">
                      {payImages.map((img, i) => (
                        <div key={i} className="relative">
                          <img src={img} className="w-16 h-16 object-cover rounded-lg border border-slate-200" alt={`收款${i+1}`} />
                          <button onClick={()=>setPayImages(payImages.filter((_,j)=>j!==i))} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-rose-500 text-white text-xs leading-none">×</button>
                        </div>
                      ))}
                    </div>
                  )}
                  {payImages.length < 3 && <PasteImageBox value="" onChange={(img)=>img&&setPayImages([...payImages, img])} label="添加收款截图" helper="打开付款截图后复制图片，点这里 Ctrl+V 粘贴" />}
                </div>
              </Field>
              <Field label="备注"><textarea className={inputCls+" resize-none h-36"} value={note} onChange={e=>setNote(e.target.value)} /></Field>
            </div>
            <div className="flex justify-end gap-2">
              <button onClick={()=>{setAmount("");setGiftAmount("0");setPayImages([]);setNote("");}} className="px-4 py-2 rounded-2xl border border-slate-300 text-sm">重填</button>
              <button onClick={saveRecharge} className="px-4 py-2 rounded-2xl bg-slate-800 text-white text-sm">提交</button>
            </div>
          </div>
        )}

        {pane === "balance" && (
          <div className="p-4">
            <input className={inputCls+" mb-3"} placeholder="搜索老板昵称 / VIP编号 / KOOK / 微信" value={search} onChange={e=>setSearch(e.target.value)} />
            <CustomersMiniTable customers={filteredCustomers} onRecharge={(c)=>{setMode("old");setCustomerId(c.id);setPane("recharge")}} />
          </div>
        )}

        {pane === "review" && <PendingOrdersReview db={db} persist={persist} flash={flash} />}
      </Card>
    </div>
  );
}

      <table className="min-w-[1050px] w-full text-sm">
        <thead className="bg-slate-50/80 text-slate-500">
          <tr>{["老板昵称","老板编号","会员等级","VIP折扣","累计充值","累计赠送","账户余额","累计消费","KOOK用户名","操作"].map(h=><th key={h} className="px-3 py-2 text-left">{h}</th>)}</tr>

        <tbody>{customers.map(c=><tr key={c.id} className="border-t border-slate-100 hover:bg-indigo-50/40">

          <td className="px-3 py-2 font-mono">{c.vipCode}</td>
          <td className="px-3 py-2"><Badge tone={String(c.level).startsWith("SVIP") ? "indigo" : "slate"}>{c.level}</Badge></td>

          <td className="px-3 py-2 text-right font-mono">{yuan(c.cumulativeGift)}</td>

        </tr>)}</tbody>

/* ------------------------------ order creation ----------------------------- */
function OrderCreatePane({ db, persist, flash }) {
  const staff = db.staffAccounts.filter(s => s.enabled !== false);
  const [shop, setShop] = useState("NOMI");
  const [dispatcherId, setDispatcherId] = useState(staff[0]?.id || "");
  const [noMode, setNoMode] = useState("new"); // new=新订单编号 append=同单追加陪玩/项目
  const [appendNo, setAppendNo] = useState("");
  const [search, setSearch] = useState("");
  const [customerId, setCustomerId] = useState("");
  const [playerId, setPlayerId] = useState("");
  const [game, setGame] = useState("三角洲护航-自定义单");
  const [tag, setTag] = useState("");
  const [billing, setBilling] = useState("round");
  const [qty, setQty] = useState(""); // 可空：自定义/体验单不填，按1计
  const [price, setPrice] = useState("");
  const [addonNote, setAddonNote] = useState("");
  const [discountId, setDiscountId] = useState("disc_none");
  const [startAt, setStartAt] = useState(dateInput());
  const [endAt, setEndAt] = useState(dateInput());
  const [note, setNote] = useState("");
  const [dispatchImage, setDispatchImage] = useState("");
  const [resultImages, setResultImages] = useState([]);

  const tagOptions = (db.customFields.find(f=>f.id==="cf_order_tag")?.options) || [];
  const sourceOptions = (db.customFields.find(f=>f.id==="cf_order_source")?.options) || [];
  const [source, setSource] = useState(sourceOptions[0] || "");

  // 今日同店订单编号（供"同单追加"）：同一编号 = 老板的一次下单，可挂多个陪玩/项目
  const todayGroups = useMemo(() => {
    const map = {};
    db.orders.filter(o => o.shop === shop && isToday(o.createdAt)).forEach(o => {
      if (!map[o.no]) map[o.no] = { no: o.no, customerId: o.customerId, customerName: o.customerName, count: 0 };
      map[o.no].count++;
    });
    return Object.values(map).sort((a,b)=>b.no.localeCompare(a.no));
  }, [db.orders, shop]);
  const appendGroup = todayGroups.find(g => g.no === appendNo);

  const shopCustomers = db.customers.filter(c => c.shop === shop);
  const filteredCustomers = shopCustomers.filter(c => !search || [c.name,c.vipCode,c.kookName,c.wechatName].some(x=>String(x||"").toLowerCase().includes(search.toLowerCase())));
  const shopPlayers = db.players.filter(p => p.shop === shop);
  const customer = noMode === "append" && appendGroup
    ? db.customers.find(c => c.id === appendGroup.customerId)
    : db.customers.find(c => c.id === customerId);

  const enabledDiscounts = (db.discounts || []).filter(d => d.enabled !== false);
  const discount = (db.discounts || []).find(d => d.id === discountId) || enabledDiscounts[0];
  const sharePct = shareForGame(db, game);
  const m = computeMoney({ qty, price, discount, sharePct });
  const isOverdraft = customer?.customerType === "overdraft";
  const balanceShort = customer && !isOverdraft && num(customer.balance) < m.amount;

  const submit = () => {
    const p = db.players.find(x => x.id === playerId);
    const staffer = staff.find(s => s.id === dispatcherId) || staff[0];
    if (!customer) return flash(noMode === "append" ? "请选择要追加的订单编号" : "请选择老板");
    if (!p) return flash("请选择陪玩");
    if (num(price) <= 0) return flash("单价需大于 0");
    if (qty !== "" && num(qty) <= 0) return flash("接单数量需大于 0（不填则按 1 计）");
    if (new Date(endAt) < new Date(startAt)) return flash("结束时间不能早于开始时间");
    let no;
    if (noMode === "append" && appendGroup) { no = appendGroup.no; }
    else {
      const d = new Date();
      const dayKey = d.toDateString();
      const usedNos = new Set(db.orders.filter(o => o.shop === shop && new Date(o.createdAt).toDateString() === dayKey).map(o => o.no));
      no = `${shop === "NOMI" ? "N" : "E"}${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}${pad(usedNos.size + 1, 3)}`;
    }
    const order = {
      id: uid("o_"), no, shop,
      customerId: customer.id, customerName: customer.name, customerVipCode: customer.vipCode,
      playerId: p.id, playerName: p.name, playerGender: p.gender,
      dispatcherId: staffer?.id, dispatcherName: staffer?.name,
      game: game.trim() || "未填写", tag, billing,
      qty: qty === "" ? null : num(qty), price: r2(num(price)), addonNote: addonNote.trim(),
      discountId: discount?.id, discountLabel: discount?.label || "无折扣", discountRate: discount?.rate ?? 1,
      bearer: discount?.bearer || "shop", playerBearPct: discount?.bearer === "shared" ? num(discount.playerBearPct) : 0,
      vipLevel: customer.level, vipDiscountRate: customer.vipDiscountRate,
      subtotal: m.subtotal, discountAmount: m.discountAmount, playerBorne: m.playerBorne,
      settleBase: m.settleBase, sharePct,
      amount: m.amount, playerWage: m.playerWage, profit: m.profit,
      status: "waiting_review", settlementStatus: "unsettled",
      startAt: new Date(startAt).toISOString(), endAt: new Date(endAt).toISOString(),
      dispatchImage, resultImages, note: note.trim(), source,
      createdAt: nowISO(), updatedAt: nowISO(),
    };
    persist({ ...db, orders: [order, ...db.orders], auditLogs: [{ id: uid("log_"), type: "order", title: noMode === "append" ? "同单追加报单" : "创建报单", detail: `${no} ${customer.name} ${p.name} ${yuan(m.amount)} by ${staffer?.name}`, createdAt: nowISO() }, ...db.auditLogs] });
    flash(`报单成功 ${no}${noMode === "append" ? "（同单追加）" : ""}，等待审核`);
    setQty(""); setPrice(""); setAddonNote(""); setNote(""); setDispatchImage(""); setResultImages([]);
  };

  return (
    <div className="p-5 space-y-4">
      <div className="flex items-center gap-2 flex-wrap">
        <select className={inputCls + " w-auto"} value={shop} onChange={e=>{setShop(e.target.value); setCustomerId(""); setPlayerId(""); setAppendNo("");}}><option value="NOMI">NOMI</option><option value="EVE">EVE</option></select>
        <span className="text-sm text-slate-500">派单客服</span>
        <select className={inputCls + " w-auto"} value={dispatcherId} onChange={e=>setDispatcherId(e.target.value)}>{staff.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
        <div className="ml-auto flex items-center gap-1.5">
          <button onClick={()=>setNoMode("new")} className={`px-3 py-1.5 rounded-lg text-xs border ${noMode==="new"?"bg-slate-900 text-white border-slate-900":"border-slate-300 text-slate-500"}`}>新订单编号</button>
          <button onClick={()=>setNoMode("append")} className={`px-3 py-1.5 rounded-lg text-xs border ${noMode==="append"?"bg-slate-900 text-white border-slate-900":"border-slate-300 text-slate-500"}`}>同单追加（多人/多项目）</button>
        </div>
      </div>

      {noMode === "append" ? (
        <div className="grid md:grid-cols-2 gap-3">
          <Field label="追加到今日订单编号" required hint="同一编号代表老板的一次下单，可挂多个陪玩/项目，老板自动沿用">
            <select className={inputCls} value={appendNo} onChange={e=>setAppendNo(e.target.value)}>
              <option value="">请选择今日订单…</option>
              {todayGroups.map(g=><option key={g.no} value={g.no}>{g.no} | {g.customerName} | 已有{g.count}条</option>)}
            </select>
          </Field>
          <Field label="老板（自动沿用）"><input className={inputCls + " bg-slate-50"} value={customer ? `${customer.name} | ${customer.vipCode} | 余额 ${yuan(customer.balance)}` : ""} readOnly /></Field>
        </div>
      ) : (
        <div className="grid md:grid-cols-2 gap-3">
          <Field label="搜索老板"><input className={inputCls} value={search} onChange={e=>setSearch(e.target.value)} placeholder="昵称 / VIP编号 / KOOK / 微信" /></Field>
          <Field label="老板" required><select className={inputCls} value={customerId} onChange={e=>setCustomerId(e.target.value)}><option value="">请选择老板…</option>{filteredCustomers.map(c=><option key={c.id} value={c.id}>{c.name} | {c.vipCode} | 余额 {yuan(c.balance)}</option>)}</select></Field>
        </div>
      )}

      <div className="grid md:grid-cols-4 gap-3">
        <Field label="陪玩" required><select className={inputCls} value={playerId} onChange={e=>setPlayerId(e.target.value)}><option value="">请选择陪玩…</option>{shopPlayers.map(p=><option key={p.id} value={p.id}>{p.name}{p.status==="休息"?"（休息）":""}</option>)}</select></Field>
        <Field label="接单模式" required hint="品类决定抽成（如礼物70%，其余默认75%）"><input className={inputCls} value={game} onChange={e=>setGame(e.target.value)} placeholder="如 三角洲护航-体验单1000W 258/2" /></Field>
        <Field label="tag等级"><select className={inputCls} value={tag} onChange={e=>setTag(e.target.value)}><option value="">无</option>{tagOptions.map(t=><option key={t}>{t}</option>)}</select></Field>
        <Field label="老板来源"><select className={inputCls} value={source} onChange={e=>setSource(e.target.value)}>{sourceOptions.map(s=><option key={s}>{s}</option>)}</select></Field>
      </div>
      <div className="grid md:grid-cols-5 gap-3">
        <Field label="单价 (元)" required><input type="number" min="0" className={inputCls+" font-mono"} value={price} onChange={e=>setPrice(e.target.value)} /></Field>
        <Field label="接单数量" hint="自定义/体验单可不填，按1计"><div className="flex gap-1.5"><input type="number" min="0" step="0.5" className={inputCls+" font-mono"} value={qty} onChange={e=>setQty(e.target.value)} placeholder="可不填" /><select className={inputCls+" w-24"} value={billing} onChange={e=>setBilling(e.target.value)}>{Object.entries(BILLING).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div></Field>
        <Field label="附加单价（文字说明）" hint="加价请人工算入单价"><input className={inputCls} value={addonNote} onChange={e=>setAddonNote(e.target.value)} placeholder="如 绝密1陪2+20/h" /></Field>
        <Field label="老板折扣"><select className={inputCls} value={discountId} onChange={e=>setDiscountId(e.target.value)}>{enabledDiscounts.map(d=><option key={d.id} value={d.id}>{d.label}{d.bearer==="shared"?` · 陪玩担${d.playerBearPct||0}%`:(d.rate<1?" · 店内承担":"")}</option>)}</select></Field>
        <Field label="接单时间"><div className="flex gap-1.5"><input type="datetime-local" className={inputCls+" font-mono"} value={startAt} onChange={e=>setStartAt(e.target.value)} /><input type="datetime-local" className={inputCls+" font-mono"} value={endAt} onChange={e=>setEndAt(e.target.value)} /></div></Field>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3 p-3 rounded-lg border border-slate-200 bg-slate-50">

/* ----------------------------- player board (管理看) ----------------------- */
function PlayerBoard({ db }) {
  const [range, setRange] = useState("month");
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [dispatcherId, setDispatcherId] = useState("");
  const [playerId, setPlayerId] = useState("");
  const [settleF, setSettleF] = useState("");
  const [shopF, setShopF] = useState("");
  const staff = db.staffAccounts;

  const bounds = useMemo(() => {
    const now = new Date();
    if (range === "today") { const s = new Date(now); s.setHours(0,0,0,0); return [s, null]; }
    if (range === "week") { const s = new Date(now); const day = (s.getDay()+6)%7; s.setDate(s.getDate()-day); s.setHours(0,0,0,0); return [s, null]; }
    if (range === "month") { return [new Date(now.getFullYear(), now.getMonth(), 1), null]; }
    if (range === "custom") { return [from?new Date(from+"T00:00:00"):null, to?new Date(to+"T23:59:59"):null]; }
    return [null, null];
  }, [range, from, to]);
  const inRange = (iso) => { if(!iso) return false; const t = new Date(iso).getTime(); if(bounds[0]&&t<bounds[0].getTime()) return false; if(bounds[1]&&t>bounds[1].getTime()) return false; return true; };

  const filtered = db.orders.filter(o =>
    inRange(o.createdAt) &&
    (!dispatcherId || o.dispatcherId === dispatcherId) &&
    (!playerId || o.playerId === playerId) &&
    (!shopF || o.shop === shopF) &&
    (!settleF || (o.settlementStatus||"unsettled") === settleF)
  );
  // 排名与工资只统计「审核通过」的订单——未审核/不予通过的单不计入钱的口径
  const passed = filtered.filter(o => o.status === "audit_passed");

  const ranking = useMemo(() => {
    const m = {};
    passed.forEach(o => {
      m[o.playerId] = m[o.playerId] || { playerId: o.playerId, name: o.playerName, amount: 0, wage: 0, count: 0 };
      m[o.playerId].amount = r2(m[o.playerId].amount + num(o.amount));
      m[o.playerId].wage = r2(m[o.playerId].wage + num(o.playerWage));
      m[o.playerId].count++;
    });
    return Object.values(m).sort((a,b)=>b.amount-a.amount);
  }, [passed]);

  const wageRows = useMemo(() => ranking.map(r => {
    const p = db.players.find(x => x.id === r.playerId) || {};
    const deposit = num(p.deposit), tax = num(p.tax);
    return { ...r, realName: p.realName || "—", phone: p.phone || "—", idCard: p.idCard || "—", deposit, tax, net: r2(r.wage - deposit - tax) };
  }), [ranking, db.players]);

  const detail = useMemo(() => [...filtered].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0, 300), [filtered]);

  const presets = [["today","今天"],["week","本周"],["month","本月"],["all","全部"],["custom","自定义"]];
  const totalAmount = r2(ranking.reduce((s,r)=>s+r.amount,0));
  const totalWage = r2(ranking.reduce((s,r)=>s+r.wage,0));

  const exportRanking = () => downloadCSV("nexora_陪玩接单排名.csv", [["排行","陪玩名","接单总金额","单数","陪玩工资"], ...ranking.map((r,i)=>[i+1,r.name,r.amount,r.count,r.wage])]);
  const exportWage = () => downloadCSV("nexora_陪玩累计工资.csv", [["陪玩","实名","手机号码","身份证号","当期累计工资","需抵扣押金","应扣缴税费","实发工资总额"], ...wageRows.map(r=>[r.name,r.realName,r.phone,r.idCard,r.wage,r.deposit,r.tax,r.net])]);
  const exportDetail = () => downloadCSV("nexora_接单明细.csv", [["订单编号","派单客服","陪玩名","老板","接单状态","工资发放","接单开始时间","接单结束时间","接单模式","接单数量","单价","总价","陪玩工资","客服备注"], ...detail.map(o=>[o.no,o.dispatcherName,o.playerName,o.customerName,ORDER_STATUS[o.status]?.label,SETTLEMENT_STATUS[o.settlementStatus||"unsettled"]?.label,fmtTime(o.startAt),fmtTime(o.endAt),o.game,o.qty,o.price,o.amount,o.playerWage,o.note])]);

  return (
    <div className="space-y-5">
      <PageIntro title="陪玩管理（管理看）" subtitle="按时间段查看陪玩接单金额排名、累计工资与接单明细。排名与工资仅统计「审核通过」的订单。" />

      {/* filters */}
      <div className="grid md:grid-cols-4 gap-3">
        <Card className="p-3">
          <div className="text-xs text-slate-500 mb-2 flex items-center justify-between"><span>日期筛选显示陪玩订单金额</span>{range!=="all"&&<button onClick={()=>setRange("all")} className="text-rose-500 hover:underline">清空</button>}</div>
          <div className="flex flex-wrap gap-1.5">
            {presets.map(([k,l])=><button key={k} onClick={()=>setRange(k)} className={`text-xs px-2.5 py-1.5 rounded-lg border ${range===k?"bg-slate-900 text-white border-slate-900":"border-slate-200 text-slate-600 hover:bg-slate-100"}`}>{l}</button>)}
          </div>
          {range==="custom"&&<div className="flex items-center gap-2 mt-2"><input type="date" className={inputCls+" font-mono"} value={from} onChange={e=>setFrom(e.target.value)} /><span className="text-slate-400">—</span><input type="date" className={inputCls+" font-mono"} value={to} onChange={e=>setTo(e.target.value)} /></div>}
        </Card>
        <Card className="p-3">
          <div className="text-xs text-slate-500 mb-2">派单客服</div>
          <select className={inputCls} value={dispatcherId} onChange={e=>setDispatcherId(e.target.value)}><option value="">请选择</option>{staff.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
        </Card>
        <Card className="p-3">
          <div className="text-xs text-slate-500 mb-2">陪玩</div>
          <select className={inputCls} value={playerId} onChange={e=>setPlayerId(e.target.value)}><option value="">请选择</option>{db.players.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
        </Card>
        <Card className="p-3">
          <div className="text-xs text-slate-500 mb-2">工资发放状态 / 店铺</div>
          <div className="flex gap-2">
            <select className={inputCls} value={settleF} onChange={e=>setSettleF(e.target.value)}><option value="">全部</option>{Object.entries(SETTLEMENT_STATUS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select>
            <select className={inputCls} value={shopF} onChange={e=>setShopF(e.target.value)}><option value="">全部店</option><option value="NOMI">NOMI</option><option value="EVE">EVE</option></select>
          </div>
        </Card>
      </div>

      {/* ranking */}
      <Card>
        <div className="flex items-center justify-between p-3 border-b border-slate-200">
          <h3 className="font-medium text-sm">本期陪玩接单排名 <span className="text-xs text-slate-400 ml-2">合计 {yuan(totalAmount)} · 工资 {yuan(totalWage)}</span></h3>
          <button onClick={exportRanking} className="inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg bg-slate-900 text-white hover:bg-slate-800"><Download size={13}/>导出</button>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-xs min-w-[700px]">
            <thead className="bg-slate-50/80 text-slate-500"><tr>{["陪玩名","接单总金额（求和）","总排行","单数","陪玩工资"].map(h=><th key={h} className="px-3 py-2 text-left font-medium">{h}</th>)}</tr></thead>
            <tbody>
              {ranking.map((r,i)=><tr key={r.playerId} className="border-t border-slate-100 hover:bg-indigo-50/40"><td className="px-3 py-2">{r.name}</td><td className="px-3 py-2 font-mono">{r.amount.toFixed(2)}</td><td className="px-3 py-2 font-mono">{i+1}</td><td className="px-3 py-2 font-mono">{r.count}</td><td className="px-3 py-2 font-mono text-sky-600">{r.wage.toFixed(2)}</td></tr>)}
              {ranking.length===0&&<tr><td colSpan={5} className="text-center text-slate-400 py-10">所选条件下暂无「审核通过」的订单</td></tr>}
            </tbody>
          </table>
        </div>
      </Card>

      {/* cumulative wage */}
      <Card>
        <div className="flex items-center justify-between p-3 border-b border-slate-200">
          <h3 className="font-medium text-sm">累计工资 <span className="text-xs text-slate-400 ml-2">押金/税费默认为 0，可在陪玩档案维护</span></h3>
          <button onClick={exportWage} className="inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg bg-slate-900 text-white hover:bg-slate-800"><Download size={13}/>导出</button>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-xs min-w-[1100px]">
            <thead className="bg-slate-50/80 text-slate-500"><tr>{["申请人","实名","手机号码","身份证号","当期累计工资","需抵扣押金","应扣缴税费","实发工资总额"].map(h=><th key={h} className="px-3 py-2 text-left font-medium">{h}</th>)}</tr></thead>
            <tbody>
              {wageRows.map(r=><tr key={r.playerId} className="border-t border-slate-100 hover:bg-indigo-50/40"><td className="px-3 py-2">{r.name}</td><td className="px-3 py-2">{r.realName}</td><td className="px-3 py-2 font-mono">{r.phone}</td><td className="px-3 py-2 font-mono">{r.idCard}</td><td className="px-3 py-2 font-mono">{r.wage.toFixed(2)}</td><td className="px-3 py-2 font-mono">{r.deposit.toFixed(2)}</td><td className="px-3 py-2 font-mono">{r.tax.toFixed(2)}</td><td className="px-3 py-2 font-mono text-emerald-600">{r.net.toFixed(2)}</td></tr>)}

/* ----------------------------- review / finance ---------------------------- */
function PendingOrdersReview({ db, persist, flash }) {
  const pending = db.orders.filter(o => o.status === "waiting_review");
  const staff = db.staffAccounts.filter(s=>s.enabled!==false);
  const [operatorId, setOperatorId] = useState(staff[0]?.id || "");

  const approve = (o) => {
    if (o.status === "audit_passed") return flash("该订单已审核通过");
    const c = db.customers.find(x=>x.id===o.customerId);
    if (!c) return flash("未找到老板");
    const staffer = staff.find(s=>s.id===operatorId) || staff[0];
    if (db.settings?.segregation && o.dispatcherId && staffer?.id && o.dispatcherId === staffer.id)
      return flash("职责分离：不能审核自己创建的订单，请换一位审核人");
    if (autoOn(db, "auto_low_balance") && c.customerType !== "overdraft" && num(c.balance) < num(o.amount))
      return flash("老板余额不足，无法审核通过（可透支老板不受此限制）");
    if (db.settlements.some(s => s.orderId === o.id))
      return flash("该订单已生成工资结算，不能重复审核");
    if (db.walletTransactions.some(w => w.refType === "order" && w.refId === o.id && w.type === "order_deduct"))
      return flash("该订单已扣款，不能重复审核");
    const settlement = { id:uid("set_"), shop:o.shop, orderId:o.id, orderNo:o.no, playerId:o.playerId, playerName:o.playerName, customerName:o.customerName, amount:o.amount, playerWage:o.playerWage, status:"unsettled", createdAt:nowISO(), settledAt:"", operatorName:"" };
    const next = {
      ...db,
      customers: db.customers.map(x=>x.id===o.customerId ? {...x, balance:r2(num(x.balance)-num(o.amount))} : x),
      orders: db.orders.map(x=>x.id===o.id ? {...x, status:"audit_passed", settlementStatus:"unsettled", approvedBy:staffer?.name, approvedAt:nowISO()} : x),
      walletTransactions: [{ id:uid("wt_"), shop:o.shop, customerId:o.customerId, customerName:o.customerName, vipCode:o.customerVipCode, type:"order_deduct", amount:-num(o.amount), title:"订单扣款", refType:"order", refId:o.id, orderNo:o.no, operatorId:staffer?.id, operatorName:staffer?.name, createdAt:nowISO() }, ...db.walletTransactions],
      settlements: [settlement, ...db.settlements],
      auditLogs: [{ id:uid("log_"), type:"order", title:"订单审核通过", detail:`${o.no} ${o.customerName} ${yuan(o.amount)}`, createdAt:nowISO() }, ...db.auditLogs],
    };
    persist(next);
    flash("订单已审核通过，已扣减老板余额并生成工资待结算");
  };

  const reject = (o) => {
    persist({ ...db, orders:db.orders.map(x=>x.id===o.id?{...x,status:"audit_rejected"}:x), auditLogs:[{id:uid("log_"),type:"order",title:"订单退回",detail:o.no,createdAt:nowISO()},...db.auditLogs] });
    flash("不予通过订单");
  };

  return (
    <div className="p-4">
      <div className="flex items-center mb-3 gap-2">
        <span className="text-sm text-slate-600">审核操作人</span>
        <select className={inputCls+" w-auto"} value={operatorId} onChange={e=>setOperatorId(e.target.value)}>{staff.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
        <Badge tone="amber">等待审核 {pending.length}</Badge>
      </div>
      <div className="overflow-x-auto border border-slate-100 rounded-[20px]">
        <table className="min-w-[1200px] w-full text-xs">
          <thead className="bg-slate-50/80 text-slate-500"><tr><th className="px-2 py-2 text-left">订单编号</th><th className="px-2 py-2 text-left">老板</th><th className="px-2 py-2 text-left">余额</th><th className="px-2 py-2 text-left">陪玩</th><th className="px-2 py-2 text-left">模式</th><th className="px-2 py-2 text-right">总价</th><th className="px-2 py-2 text-right">陪玩工资</th><th className="px-2 py-2 text-left">截图</th><th className="px-2 py-2 text-left">操作</th></tr></thead>
          <tbody>
            {pending.map(o=>{
              const c=db.customers.find(x=>x.id===o.customerId);
              return <tr key={o.id} className="border-t border-slate-100 hover:bg-indigo-50/40"><td className="px-2 py-2 font-mono">{o.no}</td><td className="px-2 py-2">{o.customerName} <span className="text-slate-400">{o.customerVipCode}</span></td><td className="px-2 py-2 font-mono text-emerald-600">{yuan(c?.balance)}</td><td className="px-2 py-2">{o.playerName}</td><td className="px-2 py-2">{o.game}</td><td className="px-2 py-2 text-right font-mono">{yuan(o.amount)}</td><td className="px-2 py-2 text-right font-mono">{yuan(o.playerWage)}</td><td className="px-2 py-2"><div className="flex gap-2"><ImagePreview src={o.dispatchImage} label="派单" />{(Array.isArray(o.resultImages)?o.resultImages:(o.resultImage?[o.resultImage]:[])).map((img,ri)=><ImagePreview key={ri} src={img} label={`战绩${ri+1}`} />)}</div></td><td className="px-2 py-2"><div className="flex gap-2"><button onClick={()=>approve(o)} className="text-xs bg-emerald-600 text-white rounded px-2 py-1">审核通过</button><button onClick={()=>reject(o)} className="text-xs bg-slate-200 text-slate-700 rounded px-2 py-1">退回</button></div></td></tr>
            })}
            {pending.length===0 && <tr><td colSpan={9} className="text-center text-slate-500 py-10">暂无等待审核订单</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ReviewCenter({ db, persist, flash }) {
  return <div><PageIntro title="审核中心" subtitle="统一处理陪玩报单审核、充值审核、异常退回。"/><Card><PendingOrdersReview db={db} persist={persist} flash={flash}/></Card></div>;
}

function WithdrawalApplyPane({ db, persist, flash }) {
  const [playerId, setPlayerId] = useState("");
  const staff = db.staffAccounts.filter(s => s.enabled !== false);
  const [operatorId, setOperatorId] = useState(staff[0]?.id || "");
  const player = db.players.find(p => p.id === playerId);

  // 本次提现 = 该陪玩「审核通过 + 未结算」订单工资合计（伙伴云口径）
  const eligible = useMemo(() => db.orders.filter(o => o.playerId === playerId && o.status === "audit_passed" && (o.settlementStatus || "unsettled") === "unsettled"), [db.orders, playerId]);
  const wageAmount = r2(eligible.reduce((s, o) => s + num(o.playerWage), 0));
  const now = new Date();
  const ym = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}`;
  const monthPriorWages = r2((db.withdrawals || []).filter(w => w.playerId === playerId && w.status !== "rejected" && w.applyDate && `${new Date(w.applyDate).getFullYear()}${String(new Date(w.applyDate).getMonth()+1).padStart(2,"0")}` === ym).reduce((s, w) => s + num(w.wageAmount), 0));
  const yearPriorTaxable = r2((db.withdrawals || []).filter(w => w.playerId === playerId && w.status === "paid" && w.applyDate && new Date(w.applyDate).getFullYear() === now.getFullYear()).reduce((s, w) => s + num(w.taxableThis), 0));
  const tax = computeWithdrawalTax({ wageAmount, monthPriorWages, yearPriorTaxable, taxRule: db.settings?.taxRule });
  const depositDeduct = num(player?.deposit) || 0;
  const netPay = r2(wageAmount - depositDeduct - tax.tax);
  const hasPending = (db.withdrawals || []).some(w => w.playerId === playerId && w.status === "pending");

  const submit = () => {
    if (!player) return flash("请选择陪玩");
    if (hasPending) return flash("该陪玩已有待发放的提现申请（重复验证拦截）");
    if (wageAmount <= 0) return flash("该陪玩没有可提现的未结算工资");
    const staffer = staff.find(s => s.id === operatorId) || staff[0];
    const w = {
      id: uid("wd_"), shop: player.shop, playerId: player.id, playerName: player.name,
      realName: player.realName || "", phone: player.phone || "", idCard: player.idCard || "",
      applyDate: nowISO(), orderIds: eligible.map(o => o.id), orderCount: eligible.length,
      wageAmount, taxableThis: tax.taxableThis, tax: tax.tax, depositDeduct, netPay,
      status: "pending", paidAt: "", operatorName: staffer?.name || "", createdAt: nowISO(),
    };
    persist({ ...db, withdrawals: [w, ...(db.withdrawals || [])], auditLogs: [{ id: uid("log_"), type: "withdrawal", title: "发起工资提现申请", detail: `${player.name} ${yuan(wageAmount)} 税 ${yuan(tax.tax)} 实发 ${yuan(netPay)}`, createdAt: nowISO() }, ...db.auditLogs] });
    flash("提现申请已创建，待发放");
    setPlayerId("");
  };

  return (
    <Card className="p-4 mb-5">
      <h3 className="font-medium mb-1">发起工资提现申请</h3>
      <p className="text-xs text-slate-400 mb-3">自动汇总该陪玩「审核通过 + 未结算」的全部工资；税金按伙伴云公式计算（月免征{db.settings?.taxRule?.monthlyExempt ?? 5000}，年内{db.settings?.taxRule?.band3Annual ?? 36000}内3%，超出10%）；押金一次性抵扣。</p>
      <div className="flex flex-wrap items-center gap-2 mb-3">
        <select className={inputCls + " w-auto"} value={playerId} onChange={e=>setPlayerId(e.target.value)}>
          <option value="">选择陪玩…</option>
          {db.players.map(p => <option key={p.id} value={p.id}>{p.name}{p.realName?`（${p.realName}）`:""}</option>)}
        </select>
        <span className="text-sm text-slate-500">操作人</span>
        <select className={inputCls + " w-auto"} value={operatorId} onChange={e=>setOperatorId(e.target.value)}>{staff.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
        <button onClick={submit} disabled={!player} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-slate-900 text-white text-sm hover:bg-slate-800 disabled:opacity-40"><Banknote size={14}/>创建提现申请</button>
      </div>
      {player && (
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 p-3 rounded-lg border border-slate-200 bg-slate-50 text-sm">
          <div><p className="text-xs text-slate-500 mb-1">可结算订单</p><p className="font-mono">{eligible.length} 笔</p></div>
          <div><p className="text-xs text-slate-500 mb-1">当期累计工资</p><p className="font-mono text-sky-600">{yuan(wageAmount)}</p></div>
          <div><p className="text-xs text-slate-500 mb-1">本次应税金额</p><p className="font-mono">{yuan(tax.taxableThis)}</p></div>
          <div><p className="text-xs text-slate-500 mb-1">应扣缴税费</p><p className="font-mono text-amber-600">{yuan(tax.tax)}</p></div>
          <div><p className="text-xs text-slate-500 mb-1">需抵扣押金</p><p className="font-mono text-rose-500">{yuan(depositDeduct)}</p></div>
          <div><p className="text-xs text-slate-500 mb-1">实发工资总额</p><p className="font-mono text-emerald-600">{yuan(netPay)}</p></div>
        </div>
      )}
      {player && hasPending && <p className="text-xs text-rose-500 mt-2">该陪玩已有待发放申请，需先处理（重复验证）。</p>}
    </Card>
  );
}

function PaymentsTable({ db, persist, flash, setTab }) {
  const [q,setQ]=useState("");
  const [view,setView]=useState("all");
  const rows=db.payments.filter(p=>(view==="all"||p.status===view) && (!q || [p.customerName,p.vipCode,p.operatorName,p.method,p.note].some(x=>String(x||"").toLowerCase().includes(q.toLowerCase()))));
  const setPayStatus=(id,status)=>{
    const payment=db.payments.find(p=>p.id===id); if(!payment || payment.status===status) return;
    if (payment.status === "arrived" && status === "pending") return flash("已到账充值不能改回待审核，请选择已退款或新建冲正记录");
    if (payment.status === "refunded" && status === "pending") return flash("已退款充值不能改回待审核");
    const value=r2(num(payment.amount)+num(payment.giftAmount));
    const customer=db.customers.find(c=>c.id===payment.customerId);
    if (payment.status === "arrived" && status === "refunded" && customer && num(customer.balance) < value)
      return flash("老板余额不足，不能直接退款冲减，请先核对余额流水");
    const was=payment.status==="arrived", will=status==="arrived";
    // 余额只在“到账”状态计入。按前后是否到账求净变化：待审核→到账为正；到账→退款为负；不会重复累加。
    const delta=r2((will?value:0)-(was?value:0));
    const next={...db,
      payments:db.payments.map(p=>p.id===id?{...p,status}:p),
      customers:delta?db.customers.map(c=>c.id===payment.customerId?{...c,balance:r2(num(c.balance)+delta)}:c):db.customers,
      walletTransactions:[...db.walletTransactions],
      auditLogs:[{id:uid("log_"),type:"payment",title:"修改充值状态",detail:`${payment.customerName} → ${PAY_STATUS[status].label}`,createdAt:nowISO()},...db.auditLogs]};
    if(delta>0) next.walletTransactions.unshift({id:uid("wt_"),shop:payment.shop,customerId:payment.customerId,customerName:payment.customerName,vipCode:payment.vipCode,type:"recharge",amount:delta,title:"充值审核入账",refType:"payment",refId:payment.id,operatorName:payment.operatorName,createdAt:nowISO()});
    if(delta<0) next.walletTransactions.unshift({id:uid("wt_"),shop:payment.shop,customerId:payment.customerId,customerName:payment.customerName,vipCode:payment.vipCode,type:"refund",amount:delta,title:"充值退款冲减",refType:"payment",refId:payment.id,operatorName:payment.operatorName,createdAt:nowISO()});
    persist(next); flash(will?"充值已入账":(was?"已退款，余额已冲减":"已修改充值状态"));
  };
  const exportCSV=()=>downloadCSV("nexora_充值详情.csv",[["充值日期","老板信息","操作人员","充值状态","充值方式","充值金额","赠送金额","收款图片","备注"],...rows.map(p=>[fmtTime(p.createdAt),`${p.customerName}|${p.vipCode}`,p.operatorName,PAY_STATUS[p.status]?.label,p.method,p.amount,p.giftAmount,p.image?"已上传":"未上传",p.note])]);
  return <Card><ViewTabs views={[{id:"all",name:"全部数据"},{id:"arrived",name:"已到账"},{id:"pending",name:"待审核"},{id:"refunded",name:"已退款"}]} active={view} onChange={setView} extra={<button onClick={()=>setTab("workbench")} className="ml-auto mr-3 text-sm text-indigo-600">创建充值</button>}/><TableToolbar q={q} setQ={setQ} onExport={exportCSV}/><div className="overflow-x-auto"><table className="min-w-[1200px] w-full text-xs"><thead className="bg-slate-50/80 text-slate-500"><tr>{["充值日期","老板信息","操作人员","充值状态","充值方式","充值金额","赠送金额","收款图片","备注","操作码"].map(h=><th key={h} className="px-2 py-2 text-left font-medium">{h}</th>)}</tr></thead><tbody>{rows.map(p=><tr key={p.id} className="border-t border-slate-100 hover:bg-indigo-50/40"><td className="px-2 py-2 whitespace-nowrap">{fmtTime(p.createdAt)}</td><td className="px-2 py-2"><span className="rounded bg-slate-100 px-1.5 py-0.5">{p.customerName} | {p.vipCode}</span></td><td className="px-2 py-2">{p.operatorName}</td><td className="px-2 py-2"><select value={p.status} onChange={e=>setPayStatus(p.id,e.target.value)} className="bg-transparent text-xs">
      {Object.entries(PAY_STATUS).filter(([k]) => !(p.status === "arrived" && k === "pending") && !(p.status === "refunded" && k === "pending")).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
    </select></td><td className="px-2 py-2"><Badge tone="green">{p.method}</Badge></td><td className="px-2 py-2 text-right font-mono">{yuan(p.amount)}</td><td className="px-2 py-2 text-right font-mono">{yuan(p.giftAmount)}</td><td className="px-2 py-2"><ImagePreview src={p.image} label="收款"/></td><td className="px-2 py-2 max-w-60 truncate">{p.note||"—"}</td><td className="px-2 py-2 font-mono text-slate-500">{p.id}</td></tr>)}</tbody></table></div></Card>;
}
