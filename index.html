function SettlementsTable({ db, persist, flash, compact }) {
  const [q,setQ]=useState("");
  const staff=db.staffAccounts.filter(s=>s.enabled!==false);
  const [operatorId,setOperatorId]=useState(staff[0]?.id||"");
  const rows=db.settlements.filter(s=>!q || [s.orderNo,s.playerName,s.customerName,s.status].some(x=>String(x||"").toLowerCase().includes(q.toLowerCase())));
  const settle=(s)=>{
    if(s.status==="settled") return;
    const staffer=staff.find(x=>x.id===operatorId)||staff[0];
    persist({...db,settlements:db.settlements.map(x=>x.id===s.id?{...x,status:"settled",settledAt:nowISO(),operatorName:staffer?.name||""}:x),orders:db.orders.map(o=>o.id===s.orderId?{...o,settlementStatus:"settled"}:o),auditLogs:[{id:uid("log_"),type:"settlement",title:"工资已结算",detail:`${s.orderNo} ${s.playerName} ${yuan(s.playerWage)} by ${staffer?.name||""}`,createdAt:nowISO()},...db.auditLogs]}); flash("工资已结算");
  };
  const unsettle=(s)=>{
    if(s.status!=="settled") return;
    if(!confirm(`撤销结算：${s.orderNo} ${s.playerName} ${yuan(s.playerWage)}？将改回未结算。`)) return;
    persist({...db,settlements:db.settlements.map(x=>x.id===s.id?{...x,status:"unsettled",settledAt:"",operatorName:""}:x),orders:db.orders.map(o=>o.id===s.orderId?{...o,settlementStatus:"unsettled"}:o),auditLogs:[{id:uid("log_"),type:"settlement",title:"撤销工资结算",detail:`${s.orderNo} ${s.playerName} ${yuan(s.playerWage)}`,createdAt:nowISO()},...db.auditLogs]}); flash("已撤销结算，改回未结算");
  };
  return <Card><ViewTabs views={[{id:"all",name:"全部工资"}]} active="all" onChange={()=>{}} extra={<div className="ml-auto mr-3 flex items-center gap-2 text-sm"><span className="text-slate-500">结算操作人</span><select className={inputCls+" w-auto py-1.5"} value={operatorId} onChange={e=>setOperatorId(e.target.value)}>{staff.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>}/><TableToolbar q={q} setQ={setQ} onExport={()=>downloadCSV("nexora_工资结算.csv",[["订单","陪玩","老板","订单金额","陪玩工资","状态","生成时间","结算时间","操作人"],...rows.map(s=>[s.orderNo,s.playerName,s.customerName,s.amount,s.playerWage,SETTLEMENT_STATUS[s.status]?.label,fmtTime(s.createdAt),fmtTime(s.settledAt),s.operatorName])])}/><div className="overflow-x-auto"><table className="min-w-[1000px] w-full text-xs"><thead className="bg-slate-50/80 text-slate-500"><tr>{["订单","陪玩","老板","订单金额","陪玩工资","状态","生成时间","结算时间","操作"].map(h=><th key={h} className="px-2 py-2 text-left font-medium">{h}</th>)}</tr></thead><tbody>{rows.map(s=><tr key={s.id} className="border-t border-slate-100 hover:bg-indigo-50/40"><td className="px-2 py-2 font-mono">{s.orderNo}</td><td className="px-2 py-2">{s.playerName}</td><td className="px-2 py-2">{s.customerName}</td><td className="px-2 py-2 text-right font-mono">{yuan(s.amount)}</td><td className="px-2 py-2 text-right font-mono text-sky-600">{yuan(s.playerWage)}</td><td className="px-2 py-2"><StatusBadge map={SETTLEMENT_STATUS} value={s.status}/></td><td className="px-2 py-2">{fmtShort(s.createdAt)}</td><td className="px-2 py-2">{fmtShort(s.settledAt)}</td><td className="px-2 py-2">{s.status==="unsettled"?<button onClick={()=>settle(s)} className="text-xs bg-emerald-600 text-white rounded-md px-2 py-1 hover:bg-emerald-500">确认结算</button>:<div className="flex items-center gap-2"><span className="text-slate-400">{s.operatorName||"已结算"}</span><button onClick={()=>unsettle(s)} className="text-xs bg-slate-100 text-slate-600 rounded-md px-2 py-1 hover:bg-slate-200">撤销</button></div>}</td></tr>)}</tbody></table></div></Card>

  };
  const toggleDiscount=(id)=>persist({...db,discounts:(db.discounts||[]).map(d=>d.id===id?{...d,enabled:!d.enabled}:d)});

  const [csMatch,setCsMatch]=useState(""); const [csPct,setCsPct]=useState("");

    setCsMatch("");setCsPct("");flash("已新增品类抽成");

      <Card className="p-4"><h3 className="font-medium mb-3">风控与默认抽成</h3><div className="space-y-3">
        <div className="flex items-center justify-between border border-slate-200 rounded-lg px-3 py-2.5"><div><div className="text-sm">默认抽成比例</div><div className="text-xs text-slate-400 mt-0.5">工资 = 结算基数 × 抽成；品类抽成（右下卡片）优先，匹配不到才用此默认值。仅对新订单生效。</div></div><div className="flex items-center gap-1"><input type="number" min="0" max="100" className={inputCls+" w-20 py-1.5 font-mono"} value={db.settings?.playerSharePct ?? 75} onChange={e=>setShare(e.target.value)} /><span className="text-sm text-slate-500">%</span></div></div>
        <div className="flex items-center justify-between border border-slate-200 rounded-lg px-3 py-2.5"><div><div className="text-sm">职责分离</div><div className="text-xs text-slate-400 mt-0.5">开启后，创建订单的客服不能审核自己创建的订单</div></div><button onClick={toggleSeg} className={`text-xs rounded-md px-2.5 py-1 border ${db.settings?.segregation?"bg-emerald-50 text-emerald-700 border-emerald-200":"bg-slate-100 text-slate-500 border-slate-200"}`}>{db.settings?.segregation?"已开启":"已关闭"}</button></div>
      </div></Card>
      <Card className="p-4"><h3 className="font-medium mb-1">折扣管理</h3><p className="text-xs text-slate-400 mb-3">每档折扣可设承担方式：店内承担（陪玩按原价结算）或店内+陪玩共担（设置陪玩承担折扣的比例）。修改只影响之后的新订单。</p>
        <div className="grid grid-cols-2 gap-2 mb-2">
          <input className={inputCls} placeholder="名称，如 首单8折" value={dLabel} onChange={e=>setDLabel(e.target.value)} />
          <input type="number" min="1" max="100" className={inputCls+" font-mono"} placeholder="折扣，如 80" value={dRate} onChange={e=>setDRate(e.target.value)} />
          <select className={inputCls} value={dBearer} onChange={e=>setDBearer(e.target.value)}><option value="shop">店内承担</option><option value="shared">店内+陪玩共担</option></select>
          {dBearer==="shared"?<input type="number" min="0" max="100" className={inputCls+" font-mono"} placeholder="陪玩承担%" value={dBearPct} onChange={e=>setDBearPct(e.target.value)} />:<div className="flex items-center text-xs text-slate-400 px-1">陪玩按原价结算</div>}
        </div>
        <button onClick={addDiscount} className="px-3 py-2 bg-slate-900 text-white rounded-lg text-xs hover:bg-slate-800 mb-3">添加折扣</button>
        <div className="space-y-2">{(db.discounts||[]).map(d=><div key={d.id} className="flex items-center justify-between border border-slate-200 rounded-lg px-3 py-2 text-sm"><span className="min-w-0"><span>{d.label}</span>{d.rate<1&&<span className="text-slate-400 ml-2 font-mono">{Math.round(d.rate*100)}折</span>}<span className="text-slate-400 ml-2 text-xs">{d.bearer==="shared"?`共担·陪玩${d.playerBearPct||0}%`:"店内承担"}</span></span><span className="flex items-center gap-2 shrink-0">{!d.builtin&&<button onClick={()=>toggleDiscount(d.id)} className={`text-xs ${d.enabled?"text-emerald-600":"text-slate-400"}`}>{d.enabled?"启用":"停用"}</button>}{d.builtin||discountUsed(d.id)?<span className="text-slate-300 text-xs" title={d.builtin?"默认项不可删":"已有订单使用，只能停用"}>锁定</span>:<button onClick={()=>removeDiscount(d.id)} className="text-slate-400 hover:text-rose-500 text-xs">删除</button>}</span></div>)}</div>
      </Card>
      <Card className="p-4"><h3 className="font-medium mb-1">品类抽成</h3><p className="text-xs text-slate-400 mb-3">按接单模式前缀匹配（如「礼物」匹配「礼物-自定义单」）。匹配命中的品类按此抽成，否则用默认抽成。</p>
        <div className="flex gap-2 mb-3"><input className={inputCls} placeholder="品类前缀，如 礼物" value={csMatch} onChange={e=>setCsMatch(e.target.value)} /><input type="number" min="1" max="100" className={inputCls+" w-24 font-mono"} placeholder="%" value={csPct} onChange={e=>setCsPct(e.target.value)} /><button onClick={addCategoryShare} className="px-3 py-2 bg-slate-900 text-white rounded-lg text-xs hover:bg-slate-800 shrink-0">添加</button></div>
        <div className="space-y-2">{(db.categoryShares||[]).map(c=><div key={c.id} className="flex items-center justify-between border border-slate-200 rounded-lg px-3 py-2 text-sm"><span>「{c.match}」开头 → <span className="font-mono text-sky-600">{c.pct}%</span></span><button onClick={()=>removeCategoryShare(c.id)} className="text-slate-400 hover:text-rose-500 text-xs">删除</button></div>)}
        <div className="text-xs text-slate-400">其余品类 → 默认 <span className="font-mono">{db.settings?.playerSharePct ?? 75}%</span></div></div>
      </Card>
    </div></div>
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<NexoraConsole />);

  </script>
</body>
</html>
